events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        # 浏览器要求 HTTPS 才允许使用麦克风/语音识别(唤醒词功能依赖),
        # 证书由 docker-compose 的 nginx entrypoint 自动生成(自签名)
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # PWA 文件 (manifest.json, sw.js)
        location = /manifest.json {
            add_header Content-Type "application/manifest+json";
            try_files $uri =404;
        }

        location = /sw.js {
            add_header Content-Type "application/javascript";
            add_header Service-Worker-Allowed "/";
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            expires off;
            try_files $uri =404;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # TTS 接口(POST)
        location /tts {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # API 接口(包含新增的 reminders, proactive-greeting, auth, relationship 等)
        location ~ ^/(health|stats|tools|chat|history|auth|relationship|reminders|proactive-greeting) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # index.html 不缓存，确保手机端每次取最新版本
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # 前端静态文件
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
